services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: backfill_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d backfill_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  runner:
    build: .
    environment:
      DATABASE_URL: postgresql://demo:demo-local-only@db:5432/backfill_demo
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
